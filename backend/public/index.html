  <!-- ===== WebSocket通信 ===== -->
  <script>
    const ws = new WebSocket("wss://shitinarabeserver.com/");
    const user = localStorage.getItem("user");

    const matchBtn = document.getElementById("match-btn");
    const profileBtn = document.getElementById("profile-btn");
    const loginState = document.getElementById("login-state");

    if (user) {
      profileBtn.style.display = "block";

      matchBtn.onclick = () => {
        location.href = "/profile.html";
      };

      profileBtn.onclick = () => {
        location.href = "/profile.html";
      };
    } else {
      // 未ログイン
      matchBtn.onclick = () => {
        location.href = "/register.html";
      };
    }

    if (user) {
      const u = JSON.parse(user);
      document.getElementById("login-state").textContent =
        `ようこそ ${u.username} さん`;
    }

    ws.onopen = () => {
      ws.send(JSON.stringify({
        type: "get_ranking_top3"
      }));
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);

      if (msg.type === "ranking_top3") {
        const listEl = document.getElementById("ranking-list");
        listEl.innerHTML = "";

        if (!msg.list || msg.list.length === 0) {
          listEl.textContent = "ランキングデータがありません";
          return;
        }

        msg.list.forEach((player, index) => {
          const div = document.createElement("div");
          div.className = "rank-item";
          div.innerHTML = `
            <div class="rank-name">${index + 1}位：${player.username} ${player.dan}</div>
            <div class="rank-meta">Rating：${player.rating}</div>
          `;
          listEl.appendChild(div);
        });
      }
    };

    ws.onerror = () => {
      document.getElementById("ranking-list").textContent =
        "ランキング取得に失敗しました";
    };
  </script>
