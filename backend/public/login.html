<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
</head>
<body>

<h2>ログイン</h2>
<input id="u" placeholder="ユーザー名"><br>
<input id="p" type="password" placeholder="パスワード"><br>
<button onclick="login()">ログイン</button>

<hr>

<button onclick="location.href='/register.html'">
  アカウント登録
</button>

<script>

let socket = new WebSocket("wss://shitinarabeserver.com");

socket.onopen = () => console.log("WebSocket接続成功");
socket.onmessage = (event) => {
  const data = JSON.parse(event.data);
  if (data.status === "ok" && data.user) {
    localStorage.setItem("user", JSON.stringify(data.user));
    alert(data.message);
    location.href = "/profile.html";
  } else {
    alert(data.message);
  }
};

function login() {
  const username = document.getElementById("u").value;
  const password = document.getElementById("p").value;

  if (!socket || socket.readyState !== WebSocket.OPEN) {
    return alert("WebSocketが接続されていません");
  }

  socket.send(JSON.stringify({
    type: "login",
    username,
    password
  }));
}

</script>

</body>
</html>
