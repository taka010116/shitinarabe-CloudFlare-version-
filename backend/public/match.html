<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>七並べ ONLINE</title>

<style>
body {
  font-family: sans-serif;
  background: #0a7a3b;
  color: #fff;
  margin: 0;
  padding: 20px;
}

.panel {
  max-width: 900px;
  margin: auto;
  background: rgba(0,0,0,0.25);
  padding: 20px;
  border-radius: 8px;
}

#waiting, #game { display:none; }

#table {
  display:grid;
  grid-template-columns:repeat(13,52px);
  grid-template-rows:repeat(4,78px);
  gap:4px;
  justify-content:center;
  margin:20px auto;
  background:#0b6623;
  padding:10px;
  border-radius:10px;
}

.slot {
  width:52px;
  height:78px;
  background:#0a3;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hand-card {
  width:68px;
  height:102px;
  cursor:pointer;
  transition:.15s;
}
.hand-card:hover { transform:translateY(-8px); }

#players-ui {
  display:flex;
  gap:20px;
  justify-content:center;
}

.chat-panel {
  position:fixed;
  top:20px;
  right:20px;
  width:260px;
  height:520px;
  background:rgba(0,0,0,0.7);
  border-radius:8px;
  padding:10px;
  display:none;
  flex-direction:column;
}

#chat-log {
  flex:1;
  background:rgba(0,0,0,0.2);
  border-radius:6px;
  padding:8px;
  overflow-y:auto;
}

.chat-input { flex:1; }
.chat-send { width:60px; }

#result-overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  align-items:center;
  justify-content:center;
}
#result-panel {
  background:white;
  color:black;
  padding:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- ===== WAITING ===== -->
<div id="waiting" class="panel">
  <h2>対局待機中</h2>
  <p id="myinfo"></p>
  <p id="status">接続中…</p>
</div>

<h3>現在の接続者</h3>
<div id="player-list"></div>
<p id="status"></p>


<!-- ===== GAME ===== -->
<div id="game" class="panel">
  <div id="players-ui"></div>
  <div id="table"></div>
  <h3>あなたの手札</h3>
  <div id="hand" style="display:flex;gap:6px;justify-content:center;"></div>
  <button id="pass-btn" style="display:none;">パス</button>
</div>

<!-- ===== CHAT ===== -->
<div class="chat-panel">
  <h3>Chat</h3>
  <div id="chat-log"></div>
  <div style="display:flex;gap:6px;margin-top:6px;">
    <input id="chat-input" class="chat-input">
    <button id="chat-send" class="chat-send">送信</button>
  </div>
</div>

<!-- ===== RESULT ===== -->
<div id="result-overlay">
  <div id="result-panel">
    <h2>結果</h2>
    <ol id="result-list"></ol>
    <button onclick="location.reload()">戻る</button>
  </div>
</div>

<script>
/* ===============================
   ログイン情報取得
================================ */
const userStr = localStorage.getItem("user");
if (!userStr) location.href="/login.html";
const user = JSON.parse(userStr);

document.getElementById("waiting").style.display="block";
document.getElementById("myinfo").textContent =
  `${user.username} ｜ 段位:${user.dan} ｜ R:${user.rating}`;


  const listDiv = document.getElementById("player-list");
const status = document.getElementById("status");



/* ===============================
   WebSocket 接続（自動）
================================ */
let ws;
let myName = user.username;
let CTurn = null;

ws = new WebSocket("ws://localhost:8080");

ws.onopen = () => {
  ws.send(JSON.stringify({
    type:"join_game",
    username:myName,
    maxPlayers:4,
    dan: user.dan,
    rating: user.rating 
  }));
};

/*
ws.onmessage = (e) => {
  const msg = JSON.parse(e.data);

  if (msg.type === "waiting") {
    listDiv.innerHTML = "";

    msg.players.forEach(p => {
      const d = document.createElement("div");
      d.textContent =
        `${p.username} ｜ ${p.dan} ｜ R${p.rating}`;
      listDiv.appendChild(d);
    });

    status.textContent =
        `待機中（${msg.count}人）`;
  }

  if (msg.type === "game_start") {
    status.textContent =
      `${msg.playerCount}人で対局開始！`;
    // ここでゲーム画面へ遷移 or 初期化
  }
};
*/

ws.onmessage = e => handleMessage(JSON.parse(e.data));

/* ===============================
   メッセージ処理
================================ */
function handleMessage(msg){
  if(msg.type==="waiting"){
    listDiv.innerHTML="";
    msg.players.forEach(p=>{
      const d=document.createElement("div");
      d.textContent=`${p.username} ｜ ${p.dan} ｜ R${p.rating}`;
      listDiv.appendChild(d);
    });
    status.textContent=`待機中（${msg.count}人）`;
  }
  if (msg.type === "countdown") {
    status.textContent =
      `${msg.count}人揃いました。対局開始まで ${msg.remain} 秒`;
  }


  if(msg.type==="game_start"){
    status.textContent="対局開始！";
    document.getElementById("waiting").style.display="none";
    document.getElementById("game").style.display="block";
    document.querySelector(".chat-panel").style.display="flex";
    initTable();
  }

  if(msg.type==="update_table") updateTable(msg);
  if(msg.type==="update_hand") updateHand(msg);
  if(msg.type==="announce_turn") updateTurn(msg);
  if(msg.type==="chat") addChat(msg.text);
  if(msg.type==="game_result") showResult(msg.ranks);
}


/* ===============================
   ゲームUI
================================ */
const table=document.getElementById("table");
function initTable(){
  table.innerHTML="";
  for(let i=0;i<52;i++){
    const d=document.createElement("div");
    d.className="slot";
    table.appendChild(d);
  }
}

function updateTable(d){
  console.log("update_Table", d);
  const suits=["hearts","spades","diamonds","clubs"];
  table.innerHTML="";
  for(let i=0;i<52;i++){
    const s=document.createElement("div");
    s.className="slot";
    table.appendChild(s);
  }
  suits.forEach((s,r)=>{
    d.table[s].forEach((c,i)=>{
      if(!c)return;
      const img=document.createElement("img");
      img.src=`images/${c}.png`;
      img.style.width="100%";
      table.children[r*13+i].appendChild(img);
    });
  });
}

const hand=document.getElementById("hand");
function updateHand(d){
  if(d.username!==myName)return;
  hand.innerHTML="";
  CTurn=d.current_turn;
  const playable=new Set(d.playable);

  d.hand.forEach(c=>{
    const img=document.createElement("img");
    img.src=`images/${c}.png`;
    img.className="hand-card";
    if(!playable.has(c)||CTurn!==myName){
      img.style.opacity=.3;
    }else{
      img.onclick=()=>ws.send(JSON.stringify({
        type:"play_card",
        username:myName,
        card:c
      }));
    }
    hand.appendChild(img);
  });
}

const playersUi=document.getElementById("players-ui");
const passBtn=document.getElementById("pass-btn");

function updateTurn(d){
  playersUi.innerHTML="";
  d.players.forEach(p=>{
    const div=document.createElement("div");
    div.innerHTML=`<b style="color:${p===d.player?'red':'white'}">${p}</b><br>
      残り:${d.hand_counts[p]}<br>
      パス:${d.passes[p]??0}/3`;
    playersUi.appendChild(div);
  });

  if(d.player===myName){
    passBtn.style.display="block";
    passBtn.onclick=()=>ws.send(JSON.stringify({
      type:"pass_turn",
      username:myName
    }));
  }else{
    passBtn.style.display="none";
  }
}

/* ===============================
   Chat
================================ */
const chatLog=document.getElementById("chat-log");
const chatInput=document.getElementById("chat-input");
document.getElementById("chat-send").onclick=sendChat;
chatInput.onkeydown=e=>{if(e.key==="Enter")sendChat();}

function sendChat(){
  if(!chatInput.value)return;
  ws.send(JSON.stringify({
    type:"chat",
    username:myName,
    text:chatInput.value
  }));
  chatInput.value="";
}

function addChat(t){
  const d=document.createElement("div");
  d.textContent=t;
  chatLog.appendChild(d);
  chatLog.scrollTop=chatLog.scrollHeight;
}

/* ===============================
   Result
================================ */
function showResult(ranks){
  const list=document.getElementById("result-list");
  list.innerHTML="";
  ranks.forEach((n,i)=>{
    const li=document.createElement("li");
    li.textContent=`${i+1}位：${n}`;
    list.appendChild(li);
  });
  document.getElementById("result-overlay").style.display="flex";
}
</script>

</body>
</html>
