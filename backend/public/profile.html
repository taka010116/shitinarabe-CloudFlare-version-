<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>プロフィール</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 40px auto;
  }
  .box {
    border: 1px solid #ccc;
    padding: 16px;
    margin-bottom: 16px;
  }
  textarea {
    width: 100%;
    height: 80px;
  }
  
.container {
  display: flex;
  gap: 24px;
}

.profile {
  flex: 2;
}

.search {
  flex: 1;
  border: 1px solid #ccc;
  padding: 16px;
  height: fit-content;
}
</style>
</head>
<body>

<h2>七並べ王  PROFILE</h2>

<div class="box">
  <p><b>ユーザー名：</b><span id="username"></span></p>
  <p><b>レーティング：</b><span id="rating"></span></p>
  <p><b>段位：</b><span id="dan"></span></p>

  <p><b>勝利数</b></p>
  <ul>
    <li>1位：<span id="win1"></span></li>
    <li>2位：<span id="win2"></span></li>
    <li>3位：<span id="win3"></span></li>
    <li>4位：<span id="win4"></span></li>
  </ul>
</div>

<div class="box">
  <p><b>コメント（自由に編集できます）</b></p>
  <textarea id="comment"></textarea><br><br>
  <button onclick="saveComment()">コメント保存</button>
</div>

<button onclick="logout()">ログアウト</button>
<button onclick="location.href='/match.html'">
  対局開始
</button>
<button onclick="goTitle()">
  タイトルへ戻る
</button>

<div class="search">
    <h3>ユーザー検索</h3>
    <input id="searchName" placeholder="ユーザー名">
    <button onclick="searchUser()">検索</button>
    <p id="searchInfo"></p>
    <input id="searchName" placeholder="ユーザー名" oninput="searchUserSuggest()">
    <div id="suggestList" style="border:1px solid #ccc;"></div>
  </div>


<script>
let socket;
let viewingUser;
let searchTimer = null;

function searchUserSuggest() {
  const keyword = document.getElementById("searchName").value.trim();
  if (keyword.length === 0) {
    document.getElementById("suggestList").innerHTML = "";
    return;
  }

  // 入力中の無駄な連打防止（超重要）
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    socket.send(JSON.stringify({
      type: "search_user",
      keyword
    }));
  }, 300);
}

function renderSuggest(users) {
  const list = document.getElementById("suggestList");
  list.innerHTML = "";

  users.forEach(name => {
    const div = document.createElement("div");
    div.textContent = name;
    div.style.cursor = "pointer";
    div.style.padding = "4px";

    div.onclick = () => {
      socket.send(JSON.stringify({
        type: "get_profile",
        username: name
      }));
      list.innerHTML = "";
      document.getElementById("searchName").value = name;
    };

    list.appendChild(div);
  });
}



/* ===== ログインチェック ===== */
const userStr = localStorage.getItem("user");
if (!userStr) {
  location.href = "/login.html";
}
const loginUser = JSON.parse(userStr);
viewingUser = loginUser.username;

/* ===== WebSocket 接続 ===== */
function connectSocket() {
  socket = new WebSocket("wss://shitinarabeserver.com");

  socket.onopen = () => {
    socket.send(JSON.stringify({
      type: "get_profile",
      username: loginUser.username
    }));
  };

  socket.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === "profile") {
      renderProfile(data.user);
    }

    if (data.type === "error") {
      alert(data.message);
    }
    if (data.type === "search_result") {
      renderSuggest(data.users);
    }

    if (data.type === "profile") {
      renderProfile(data.user);
    }

  };
}

/* ===== 表示 ===== */
function renderProfile(p) {
  viewingUser = p.username;

  document.getElementById("username").textContent = p.username;
  document.getElementById("rating").textContent = p.rating;
  document.getElementById("dan").textContent = p.dan;

  document.getElementById("win1").textContent = p.win_1st;
  document.getElementById("win2").textContent = p.win_2nd;
  document.getElementById("win3").textContent = p.win_3rd;
  document.getElementById("win4").textContent = p.win_4th;

  document.getElementById("comment").value = p.comment || "";

  const isSelf = (p.username === loginUser.username);

  document.getElementById("comment").disabled = !isSelf;
  document.getElementById("searchInfo").textContent =
    isSelf ? "" : "※ 閲覧専用プロフィールです";
}

/* ===== コメント保存 ===== */
function saveComment() {
  const comment = document.getElementById("comment").value;

  socket.send(JSON.stringify({
    type: "save_comment",
    username: loginUser.username,
    comment
  }));
}

/* ===== ログアウト ===== */
function logout() {
  localStorage.removeItem("user");
  location.href = "/login.html";
}

function goTitle() {
  location.href = "/title.html";
}

/* ===== ユーザー検索 ===== */
function searchUser() {
  const name = document.getElementById("searchName").value.trim();
  if (!name) return;

  socket.send(JSON.stringify({
    type: "get_profile",
    username: name
  }));
}

connectSocket();
</script>



</body>
</html>
