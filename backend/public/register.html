<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アカウント登録</title>
</head>
<body>

<h2>アカウント登録</h2>

<input id="u" placeholder="ユーザー名"><br>
<input id="p" type="password" placeholder="パスワード"><br>

<button onclick="register()">登録</button>
<button onclick="location.href='/login.html'">戻る</button>

<script>
let socket;

function connectSocket() {
  socket = new WebSocket("wss://shitinarabeserver.com"); // サーバーの WSS URL

  socket.onopen = () => {
    console.log("WebSocket 接続成功");
  };

  socket.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.status === "ok") {
      alert(data.message);
      location.href = "/login.html";
    } else {
      alert("登録失敗: " + data.message);
    }
  };

  socket.onerror = (err) => {
    console.error("WebSocketエラー:", err);
  };

  socket.onclose = () => {
    console.log("WebSocket切断");
  };
}

connectSocket();

function register() {
  const username = document.getElementById("u").value;
  const password = document.getElementById("p").value;

  if (!socket || socket.readyState !== WebSocket.OPEN) {
    alert("WebSocketが接続されていません");
    return;
  }

  socket.send(JSON.stringify({
    type: "register",
    username,
    password
  }));
}
</script>

</body>
</html>
